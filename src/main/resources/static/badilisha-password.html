<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBE - Badilisha Password</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="academic-page">
    <header class="navbar">
        <div class="nav-brand"><h1>🎓 CBE - Badilisha Password</h1></div>
        <div class="nav-user">
            <a href="/profile.html" class="btn btn-secondary">← Rudi</a>
            <button id="logoutBtn" class="btn btn-logout">Toka</button>
        </div>
    </header>
    <main class="academic-container">
        <div class="page-header">
            <h2>🔒 Badilisha Password</h2>
            <p>Weka password yako mpya</p>
        </div>
        <div id="errorMessage" class="error-message" style="display:none;"></div>
        <div id="successMessage" class="success-message" style="display:none;"></div>
        <div class="admin-form" style="display:block;">
            <div class="input-group">
                <label>Password ya Sasa</label>
                <input type="password" id="passwordYaSasa" placeholder="Weka password ya sasa">
            </div>
            <div class="input-group">
                <label>Password Mpya</label>
                <input type="password" id="passwordMpya" placeholder="Weka password mpya (herufi 6+)">
            </div>
            <div class="input-group">
                <label>Rudia Password Mpya</label>
                <input type="password" id="passwordRudia" placeholder="Rudia password mpya">
            </div>
            <button class="btn btn-primary" onclick="badilishaPassword()">Badilisha Password</button>
        </div>
    </main>
    <script src="/js/badilisha-password.js"></script>
</body>
</html>
