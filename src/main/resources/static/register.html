<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBE Results - Jisajili</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-page">
    <div class="login-container" style="max-width: 500px;">
        <div class="login-box">
            <div class="logo">
                <h1>🎓 CBE</h1>
                <p>Jisajili - Mwanafunzi Mpya</p>
            </div>

            <form id="registerForm">
                <div class="input-group">
                    <label for="jinaKamili">Jina Kamili</label>
                    <input type="text" id="jinaKamili" placeholder="Weka jina lako kamili" required>
                </div>

                <div class="input-group">
                    <label for="nambaYaMwanafunzi">Namba ya Mwanafunzi</label>
                    <input type="text" id="nambaYaMwanafunzi" placeholder="Mfano: CBE-2024-031" required>
                </div>

                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Weka username" required autocomplete="username">
                </div>

                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Weka email" required>
                </div>

                <div class="input-group">
                    <label for="jinsia">Jinsia</label>
                    <select id="jinsia" required style="width: 100%; padding: 12px 16px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 15px;">
                        <option value="">Chagua jinsia</option>
                        <option value="M">Mwanaume</option>
                        <option value="F">Mwanamke</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="course">Course</label>
                    <select id="course" required style="width: 100%; padding: 12px 16px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 15px;">
                        <option value="">Chagua course</option>
                        <option value="Computer Science">Computer Science</option>
                        <option value="Business">Business</option>
                        <option value="Accounting">Accounting</option>
                        <option value="Information Technology">Information Technology</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="mwakaWaKujiunga">Mwaka wa Kujiunga</label>
                    <input type="number" id="mwakaWaKujiunga" placeholder="Mfano: 2024" value="2024" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Weka password (herufi 6+)" required autocomplete="new-password">
                </div>

                <div class="input-group">
                    <label for="passwordRudia">Rudia Password</label>
                    <input type="password" id="passwordRudia" placeholder="Rudia password" required autocomplete="new-password">
                </div>

                <div id="errorMessage" class="error-message" style="display:none;"></div>
                <div id="successMessage" class="success-message" style="display:none;"></div>

                <button type="submit" class="btn btn-primary" id="registerBtn">Jisajili</button>
            </form>

            <div class="login-footer">
                <p>Una account tayari? <a href="/login.html" style="color: #667eea; text-decoration: none; font-weight: 600;">Ingia hapa</a></p>
                <p style="margin-top: 8px;">© 2026 Chuo cha CBE</p>
            </div>
        </div>
    </div>
    <script src="/js/register.js"></script>
</body>
</html>
