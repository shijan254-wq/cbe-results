# ============================================
# SERVER
# ============================================
server.port=8082
server.servlet.context-path=/

# ============================================
# DATABASE - MySQL XAMPP
# ============================================
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/cbe_results?useSSL=false&serverTimezone=Africa/Dar_es_Salaam&allowPublicKeyRetrieval=true
spring.datasource.username=cbe_app
spring.datasource.password=Cbe@2026
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# JPA / HIBERNATE
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false

# ============================================
# JWT
# ============================================
jwt.secret=CbeResultsSystem2026SuperSecretKeyForJwtTokenGenerationMustBeAtLeast256BitsLong
jwt.expiration=86400000

# ============================================
# JACKSON
# ============================================
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.default-property-inclusion=non_null