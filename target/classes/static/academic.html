<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBE Results - Academic</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="academic-page">
    <header class="navbar">
        <div class="nav-brand"><h1>🎓 CBE Results</h1></div>
        <div class="nav-user">
            <a href="/dashboard.html" class="btn btn-secondary">← Rudi</a>
            <button id="logoutBtn" class="btn btn-logout">Toka</button>
        </div>
    </header>
    <main class="academic-container">
        <div class="page-header">
            <h2>📚 Matokeo Yangu</h2>
            <p id="studentInfo">Inapakia...</p>
            <div style="margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap;">
                <button onclick="downloadFile('http://localhost:8082/api/matokeo/pdf', 'matokeo.pdf')" class="btn btn-pdf">📄 Pakua PDF</button>
                <button onclick="downloadFile('http://localhost:8082/api/export/matokeo-yangu', 'matokeo.csv')" class="btn btn-csv">📊 Pakua CSV</button>
            </div>
        </div>
        <div id="loadingMessage" class="loading">Inapakia matokeo...</div>
        <div id="errorMessage" class="error-message" style="display:none;"></div>
        <div id="resultsContainer" style="display:none;">
            <div class="results-summary">
                <div class="summary-card">
                    <h3>Jumla ya Kozi</h3>
                    <p id="totalCourses">0</p>
                </div>
                <div class="summary-card">
                    <h3>Wastani</h3>
                    <p id="averageScore">0</p>
                </div>
                <div class="summary-card">
                    <h3>GPA</h3>
                    <p id="gpa">0.0</p>
                </div>
            </div>
            <table class="results-table">
                <thead>
                    <tr>
                        <th>Code</th><th>Kozi</th><th>Credits</th>
                        <th>Alama</th><th>Grade</th><th>Mwaka</th><th>Semester</th>
                    </tr>
                </thead>
                <tbody id="resultsBody"></tbody>
            </table>
        </div>
    </main>
    <script src="/js/app.js"></script>
    <script src="/js/download.js"></script>
</body>
</html>
